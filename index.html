<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Minimalis Tanpa Keranjang</title>
    <!-- Memuat Tailwind CSS dan Font Inter -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        /* Style untuk gambar persegi, memaksimalkan ruang horizontal */
        .product-image {
            aspect-ratio: 1/1; 
            object-fit: cover;
        }
        /* Padding sangat minimal untuk konten kartu */
        .product-card-content {
            padding: 0.5rem; 
            min-height: 50px; /* Memastikan ruang minimum untuk teks */
        }
        .product-card {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .product-card:hover {
            box-shadow: 0 4px 8px -1px rgba(45, 212, 191, 0.2);
            transform: scale(1.03); /* Sedikit efek zoom pada hover */
        }
    </style>
</head>
<body>

    <!-- 1. Navigasi Bar (Header: Sangat Pendek) -->
    <header class="sticky top-0 z-50 bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-2 sm:px-4">
            <div class="flex justify-between items-center h-10">
                <a href="#" class="text-lg font-bold text-teal-600 tracking-tight">Katalog Penuh</a>
                <!-- Link navigasi dihilangkan untuk fokus pada kepadatan -->
            </div>
        </div>
    </header>

    <main>
        <!-- 2. Bagian Banner (Sangat Pendek) -->
        <section id="banner" class="pt-8 pb-8 bg-gradient-to-r from-teal-500 to-teal-700 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 text-center">
                <h1 class="text-2xl sm:text-3xl font-extrabold mb-1">
                    Koleksi Produk Terbaik
                </h1>
                <p class="text-sm opacity-90">
                    Ribuan produk tersusun rapi untuk Anda jelajahi.
                </p>
            </div>
        </section>
        
        <!-- 3. Bagian Pencarian Produk (Ringkas) -->
        <section id="pencarian" class="py-4 -mt-4 z-20 relative">
            <div class="max-w-4xl mx-auto px-4 sm:px-6">
                <div class="bg-white p-3 rounded-xl shadow-xl border-b-2 border-teal-500">
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="Cari nama produk atau harga..." 
                        class="w-full p-2 text-sm border border-gray-200 rounded-lg focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition duration-150"
                        onkeyup="handleSearch()"
                        aria-label="Kolom Pencarian Produk"
                    >
                </div>
            </div>
        </section>

        <!-- 4. Bagian Daftar Produk (SANGAT PADAT - 8 KOLOM) -->
        <section id="produk-list" class="py-6">
            <div class="max-w-7xl mx-auto px-2 sm:px-4 lg:px-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4 text-center sm:text-left">Semua Item</h2>
                
                <!-- Kontainer Grid Produk: 3 kolom mobile, 5 tablet, 8 desktop besar -->
                <div id="product-list-container" class="grid grid-cols-3 gap-2 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-7 xl:grid-cols-8 lg:gap-3">
                    <!-- Produk akan dirender di sini oleh JavaScript -->
                </div>

                <!-- Pesan Jika Produk Tidak Ditemukan -->
                <div id="no-results" class="hidden text-center mt-8 p-6 bg-white rounded-xl shadow-lg">
                    <p class="text-base text-gray-600 font-semibold">Produk tidak ditemukan.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- 5. Footer (Sangat Pendek) -->
    <footer class="bg-gray-800 py-3 mt-4">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-xs text-gray-400">
                Katalog Produk Tanpa Fitur Keranjang.
            </p>
        </div>
    </footer>

        const productContainer = document.getElementById('product-list-container');
        const searchInput = document.getElementById('search-input');
        const noResultsMessage = document.getElementById('no-results');

        // Fungsi untuk memformat angka menjadi format Rupiah
        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(number);
        }

        // Fungsi untuk merender daftar produk
        function renderProducts(productsToRender) {
            productContainer.innerHTML = ''; 

            if (productsToRender.length === 0) {
                noResultsMessage.classList.remove('hidden');
                return;
            }

            noResultsMessage.classList.add('hidden');

            productsToRender.forEach(product => {
                const card = `
                    <a href="#" onclick="viewProductDetails('${product.name}')" class="product-card bg-white rounded-lg shadow-sm overflow-hidden border border-gray-100 block">
                        <!-- Gambar Produk -->
                        <img 
                            src="${product.imageUrl}" 
                            alt="${product.name}" 
                            class="product-image w-full bg-gray-100"
                            onerror="this.onerror=null;this.src='https://placehold.co/400x400/e5e7eb/6b7280?text=NO+IMG';"
                        >

                        <!-- Detail Produk (Sangat Ringkas) -->
                        <div class="product-card-content">
                            
                            <!-- Nama Produk (Satu Baris, Teks Sangat Kecil) -->
                            <h3 class="text-xs font-medium text-gray-800 leading-tight whitespace-nowrap overflow-hidden text-ellipsis mb-1" title="${product.name}">${product.name}</h3>
                            
                            <!-- Harga (Teks Kecil) -->
                            <p class="text-sm font-bold text-red-600">${formatRupiah(product.price)}</p>

                        </div>
                    </a>
                `;
                productContainer.innerHTML += card;
            });
        }

        // Fungsi untuk menangani klik pada kartu (menggantikan tombol keranjang)
        function viewProductDetails(productName) {
            // Ini adalah placeholder untuk melihat detail produk.
            console.log(`Mengalihkan ke halaman detail produk: ${productName}`);

            const originalPlaceholder = searchInput.placeholder;
            searchInput.placeholder = `Anda mengklik: ${productName}. Ini akan membuka halaman detail!`;
            setTimeout(() => {
                searchInput.placeholder = originalPlaceholder;
            }, 2000);
            
            // Menghentikan navigasi ke atas halaman jika menggunakan anchor href="#"
            return false;
        }


        // Fungsi untuk menangani pencarian/filtering produk
        function handleSearch() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            
            const filteredProducts = products.filter(product => {
                const searchString = `${product.name} ${product.category} ${product.price}`.toLowerCase();
                return searchString.includes(searchTerm);
            });

            renderProducts(filteredProducts);
        }

        // Inisialisasi: Render semua produk saat halaman dimuat
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts(products);
        });
    </script>
